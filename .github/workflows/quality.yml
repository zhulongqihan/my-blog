name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test

  deployment-config:
    name: Deployment config and diff hygiene
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_DATABASE: blogdb
      MYSQL_USER: ci-bloguser
      MYSQL_PASSWORD: ci-database-password
      REDIS_PASSWORD: ci-redis-password
      RABBITMQ_DEFAULT_USER: ci-rabbitmq
      RABBITMQ_DEFAULT_PASS: ci-rabbitmq-password
      JWT_SECRET: ci-jwt-secret-for-validation-only
      DASHSCOPE_API_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - run: docker compose config --quiet
      - name: Verify tracked environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.env\.|.*\.env$)' | grep -v '^docker/\.env\.example$'; then
            echo 'Tracked environment files detected.'
            exit 1
          fi
